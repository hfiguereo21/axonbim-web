name: ci

# Independent verification of what an agent or a local run claims. Kept separate
# from e2e.yml so a browser failure and a type/unit failure are distinguishable.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Historial completo, no el shallow por defecto: el guard de
          # fast-forward de abajo necesita tener el commit ANTERIOR en el
          # checkout para comparar. Con depth 1 nunca esta, el guard falla
          # cerrado ("no se puede verificar") y todo push a main sale rojo
          # sin que nada este mal. Se descubrio en el primer push a main
          # posterior a que el guard existiera: su unica corrida historica.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # App toolchain (package.json engines >=22). Actions run on Node 24 runtime.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Main branch fast-forward only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm check:history
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_AFTER: ${{ github.event.after }}
          GITHUB_REF: ${{ github.ref }}

      - name: No test shortcuts or type suppressions
        run: pnpm check:shortcuts

      - name: Documentation reachable from the AGENTS.md index
        run: pnpm check:docs

      - name: Markdown relative links resolve
        run: pnpm check:links

      - name: Domain and viewer layer purity
        run: pnpm check:layers

      - name: Every workspace member is covered by the checks
        run: pnpm check:coverage

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test
        env:
          CI: true

      # Typecheck is not a build: bundling can fail on its own.
      - name: Production build
        run: pnpm build
